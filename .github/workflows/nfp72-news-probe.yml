name: Temporary NFP72 historical news probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nfp72-news-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe packages
        run: python -m pip install requests feedparser pandas openpyxl lxml
      - name: Probe historical sources
        shell: bash
        run: |
          python - <<'PY'
          import io, json, re, requests, feedparser, pandas as pd
          from urllib.parse import quote_plus

          s = requests.Session()
          s.headers.update({'User-Agent':'NFP72 historical research (contact: evan-massang GitHub)'})

          queries = {
            'layoffs': '("mass layoffs" OR layoffs OR "job cuts" OR "hiring freeze" OR "WARN notice") (workers OR jobs OR employees) United States',
            'hiring': '("plans to hire" OR "new jobs" OR "workforce expansion" OR "labor shortage" OR recruitment) United States',
            'strikes': '(strike OR walkout OR lockout OR "work stoppage" OR "return to work") (workers OR employees) United States',
          }
          for name,q in queries.items():
            full = f'{q} after:2024-06-01 before:2024-07-06'
            url = 'https://news.google.com/rss/search?q=' + quote_plus(full) + '&hl=en-US&gl=US&ceid=US:en'
            r=s.get(url,timeout=30); print('\nGOOGLE',name,r.status_code,len(r.content),r.url)
            feed=feedparser.parse(r.content)
            print('entries',len(feed.entries),'bozo',feed.bozo)
            for e in feed.entries[:5]: print('-',e.get('published',''),e.get('title',''))

          # Challenger WordPress API / sitemap probes.
          urls=[
            'https://www.challengergray.com/wp-json/wp/v2/posts?search=job%20cuts&after=2024-06-01T00:00:00&before=2024-07-06T23:59:59&per_page=20',
            'https://www.challengergray.com/wp-json/wp/v2/search?search=job%20cuts&per_page=10',
            'https://www.challengergray.com/post-sitemap.xml',
          ]
          for u in urls:
            r=s.get(u,timeout=30); print('\nCHALLENGER',r.status_code,r.headers.get('content-type'),len(r.content),u)
            print(r.text[:500].replace('\n',' '))

          # BLS work-stoppages combined workbook.
          u='https://www.bls.gov/web/wkstp/monthly-listing.xlsx'
          r=s.get(u,timeout=60); print('\nBLS XLSX',r.status_code,r.headers.get('content-type'),len(r.content))
          if r.ok:
            xls=pd.ExcelFile(io.BytesIO(r.content)); print('sheets',xls.sheet_names)
            for sh in xls.sheet_names[:2]:
              d=pd.read_excel(io.BytesIO(r.content),sheet_name=sh,header=None)
              print('sheet',sh,d.shape); print(d.head(12).to_string())

          # FEMA open API probe.
          u="https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries?$filter=declarationDate%20ge%20'2024-06-01T00:00:00.000Z'%20and%20declarationDate%20lt%20'2024-07-06T00:00:00.000Z'&$top=20"
          r=s.get(u,timeout=30); print('\nFEMA',r.status_code,len(r.content)); print(r.text[:1000])
          PY

name: Temporary NFP72 historical news research

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nfp72-news-research.yml'
      - 'scripts/research/nfp72_news_parts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out temporary research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            pandas==2.2.3 \
            scipy==1.14.1 \
            scikit-learn==1.5.2 \
            requests==2.32.3 \
            feedparser==6.0.11 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            joblib==1.4.2 \
            python-dateutil==2.9.0.post0

      - name: Reassemble and verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/research/nfp72_news_parts/script_*.part \
            | base64 --decode | gzip --decompress > /tmp/nfp72_news_remote.py
          cat scripts/research/nfp72_news_parts/ledger_*.part \
            > scripts/research/nfp72_feature_ledger.csv.gz.b64
          python -m py_compile /tmp/nfp72_news_remote.py
          base64 --decode scripts/research/nfp72_feature_ledger.csv.gz.b64 \
            | gzip --decompress > /tmp/NFP72_FEATURE_LEDGER.csv
          test "$(python - <<'PY'
import pandas as pd
p='/tmp/NFP72_FEATURE_LEDGER.csv'
df=pd.read_csv(p)
print(len(df))
PY
          )" = "72"
          sha256sum /tmp/nfp72_news_remote.py /tmp/NFP72_FEATURE_LEDGER.csv \
            | tee /tmp/input_sha256.txt

      - name: Build point-in-time news ledger and run forward experiment
        env:
          NFP72_NEWS_OUT: nfp72_news_artifacts
          PYTHONUNBUFFERED: '1'
          PYTHONHASHSEED: '0'
        shell: bash
        run: |
          set -o pipefail
          python /tmp/nfp72_news_remote.py 2>&1 | tee nfp72_news_run.log

      - name: Preserve provenance
        if: always()
        shell: bash
        run: |
          mkdir -p nfp72_news_artifacts
          cp nfp72_news_run.log nfp72_news_artifacts/run.log 2>/dev/null || true
          cp /tmp/input_sha256.txt nfp72_news_artifacts/input_sha256.txt 2>/dev/null || true
          {
            python --version
            python -m pip freeze
            git rev-parse HEAD
          } > nfp72_news_artifacts/environment.txt

      - name: Upload complete research bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfp72-news-research-results
          path: nfp72_news_artifacts/
          if-no-files-found: error
          retention-days: 5
